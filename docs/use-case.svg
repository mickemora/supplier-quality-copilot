<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" width="1280" height="660" role="img" aria-labelledby="t d">
  <title id="t">Supplier Quality Copilot: one new defect report, three suppliers, one shared root cause</title>
  <desc id="d">Defect reports from three suppliers are linked by a shared tier-2 plating shop. The copilot reads them, spots the repeat root cause, brings back the fix that worked last year, and drafts a corrective action request for an engineer to approve.</desc>
  <defs>
    <style>
      .t { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .h1 { font-size: 30px; font-weight: 700; fill: #182433; }
      .sub { font-size: 17px; fill: #5a6878; }
      .lbl { font-size: 13px; fill: #5a6878; }
      .name { font-size: 17px; font-weight: 700; fill: #182433; }
      .body { font-size: 14px; fill: #182433; }
      .muted { font-size: 13px; fill: #5a6878; }
      .tagtx { font-size: 12.5px; font-weight: 700; }
      .card { fill: #ffffff; stroke: #c9d1d9; stroke-width: 1; }
      .step { font-size: 13px; font-weight: 700; fill: #5a6878; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6878"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d99a1e"/>
    </marker>
  </defs>

  <rect width="1280" height="660" fill="#edf0f2"/>

  <!-- Headline -->
  <g class="t">
    <text x="48" y="62" class="h1">One new defect report. Three suppliers. One shared root cause.</text>
    <text x="48" y="94" class="sub">The copilot connects reports no one had time to read together, and brings back the fix that already worked.</text>
  </g>

  <!-- Column labels: a real left-to-right sequence -->
  <g class="t">
    <text x="48" y="146" class="step">1  Defect reports arrive from different suppliers</text>
    <text x="440" y="146" class="step">2  The copilot reads and connects them</text>
    <text x="808" y="146" class="step">3  The team gets the answer and the paperwork</text>
  </g>

  <!-- Supplier NCR cards -->
  <g class="t">
    <rect x="48" y="166" width="300" height="88" rx="8" class="card"/>
    <text x="68" y="196" class="name">Ardent Interconnect</text>
    <text x="68" y="216" class="muted">Connectors, 2 open NCRs</text>
    <path d="M76,226 h126 a3,3 0 0 1 3,3 v18 a3,3 0 0 1 -3,3 h-126 l-8,-12 z" fill="#d99a1e"/>
    <circle cx="78" cy="238" r="2.6" fill="#ffffff"/>
    <text x="86" y="243" class="tagtx" fill="#3d2a03">Thin gold plating</text>

    <rect x="48" y="270" width="300" height="88" rx="8" fill="#ffffff" stroke="#d99a1e" stroke-width="2.5"/>
    <text x="68" y="300" class="name">Mesa Contact Systems</text>
    <text x="68" y="320" class="muted">Connectors, new NCR today</text>
    <path d="M76,330 h126 a3,3 0 0 1 3,3 v18 a3,3 0 0 1 -3,3 h-126 l-8,-12 z" fill="#d99a1e"/>
    <circle cx="78" cy="342" r="2.6" fill="#ffffff"/>
    <text x="86" y="347" class="tagtx" fill="#3d2a03">Thin gold plating</text>
    <rect x="276" y="282" width="54" height="22" rx="11" fill="#182433"/>
    <text x="303" y="297" text-anchor="middle" class="tagtx" fill="#ffffff">New</text>

    <rect x="48" y="374" width="300" height="88" rx="8" class="card"/>
    <text x="68" y="404" class="name">Pinnacle Harness</text>
    <text x="68" y="424" class="muted">Cable assemblies, closed last year</text>
    <path d="M76,434 h126 a3,3 0 0 1 3,3 v18 a3,3 0 0 1 -3,3 h-126 l-8,-12 z" fill="#2f7a4d"/>
    <circle cx="78" cy="446" r="2.6" fill="#ffffff"/>
    <text x="86" y="451" class="tagtx" fill="#ffffff">Thin gold plating</text>
  </g>

  <!-- Hidden sub-tier link -->
  <g fill="none" stroke="#d99a1e" stroke-width="2" stroke-dasharray="6 5">
    <path d="M348,210 H378"/>
    <path d="M348,314 H378"/>
    <path d="M348,418 H378"/>
    <path d="M378,210 V546 H348"/>
  </g>
  <g class="t">
    <rect x="48" y="500" width="300" height="92" rx="8" fill="#182433"/>
    <text x="68" y="527" class="lbl" fill="#c9d1d9" style="fill:#c9d1d9">Hidden link the copilot surfaces</text>
    <text x="68" y="553" class="name" style="fill:#e5ae3d">Coastal Finishing Co.</text>
    <text x="68" y="575" class="body" style="fill:#dfe6ec">The tier-2 plater all three suppliers use</text>
  </g>

  <!-- Arrow into the copilot -->
  <path d="M384,330 H432" stroke="#5a6878" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Copilot -->
  <g class="t">
    <rect x="440" y="166" width="328" height="426" rx="16" fill="#182433"/>
    <path d="M478,196 h30 v36 h-30 l-9,-9 v-18 z" fill="#d99a1e"/>
    <circle cx="479" cy="214" r="3.5" fill="#182433"/>
    <text x="524" y="208" style="font-size:22px;font-weight:700;fill:#ffffff">Supplier Quality</text>
    <text x="524" y="234" style="font-size:22px;font-weight:700;fill:#ffffff">Copilot</text>

    <g style="font-size:16px;fill:#dfe6ec">
      <circle cx="476" cy="290" r="5" fill="#d99a1e"/>
      <text x="494" y="295">Reads every NCR, 8D and SCAR</text>
      <circle cx="476" cy="338" r="5" fill="#d99a1e"/>
      <text x="494" y="343">Spots the same root cause</text>
      <text x="494" y="364">across different suppliers</text>
      <circle cx="476" cy="406" r="5" fill="#d99a1e"/>
      <text x="494" y="411">Answers questions with</text>
      <text x="494" y="432">links to the source reports</text>
      <circle cx="476" cy="474" r="5" fill="#d99a1e"/>
      <text x="494" y="479">Drafts the corrective action</text>
      <text x="494" y="500">request (SCAR)</text>
    </g>
    <line x1="468" y1="534" x2="740" y2="534" stroke="#2f3a46"/>
    <text x="468" y="564" style="font-size:13px;fill:#96a3b1">Claude on Amazon Bedrock + AWS CDK</text>
  </g>

  <!-- Arrows out -->
  <g stroke="#5a6878" stroke-width="2" fill="none">
    <path d="M768,300 C786,300 786,222 800,222" marker-end="url(#arrow)"/>
    <path d="M768,360 H800" marker-end="url(#arrow)"/>
    <path d="M768,420 C786,420 786,498 800,498" marker-end="url(#arrow)"/>
  </g>

  <!-- Outputs -->
  <g class="t">
    <!-- Pattern alert -->
    <rect x="808" y="166" width="424" height="112" rx="8" class="card"/>
    <path d="M808,174 a8,8 0 0 1 8,-8 h76 v112 h-76 a8,8 0 0 1 -8,-8 z" fill="#d99a1e"/>
    <circle cx="850" cy="188" r="6" fill="#edf0f2"/>
    <text x="850" y="232" text-anchor="middle" style="font-size:34px;font-weight:700;fill:#3d2a03">3</text>
    <text x="850" y="254" text-anchor="middle" style="font-size:12.5px;font-weight:700;fill:#3d2a03">suppliers</text>
    <text x="912" y="194" class="lbl">Pattern alert</text>
    <text x="912" y="220" class="name">Thin gold plating at 3 suppliers</text>
    <text x="912" y="244" class="body">Plating bath drift at the shared plater,</text>
    <text x="912" y="264" class="body">found before it delays deliveries</text>

    <!-- Fix that worked -->
    <rect x="808" y="304" width="424" height="112" rx="8" class="card"/>
    <rect x="808" y="304" width="8" height="112" rx="4" fill="#2f7a4d"/>
    <text x="836" y="332" class="lbl">The fix that already worked (NCR-2025-0015)</text>
    <text x="836" y="358" class="name">Check the bath every shift and test</text>
    <text x="836" y="380" class="name">plating thickness at receiving</text>
    <text x="836" y="402" class="body">Reused, not reinvestigated</text>

    <!-- SCAR draft -->
    <rect x="808" y="442" width="424" height="150" rx="8" class="card"/>
    <path d="M836,462 h40 l12,12 v52 h-52 z" fill="#ffffff" stroke="#5a6878" stroke-width="1.5"/>
    <path d="M876,462 v12 h12" fill="none" stroke="#5a6878" stroke-width="1.5"/>
    <g stroke="#c9d1d9" stroke-width="2"><line x1="844" y1="488" x2="880" y2="488"/><line x1="844" y1="498" x2="880" y2="498"/><line x1="844" y1="508" x2="870" y2="508"/></g>
    <text x="906" y="476" class="lbl">Corrective action request</text>
    <text x="906" y="500" class="name">SCAR draft to Mesa Contact Systems</text>
    <text x="906" y="522" class="body">Cites the evidence and the proven fix</text>
    <path d="M914,546 h106 a3,3 0 0 1 3,3 v18 a3,3 0 0 1 -3,3 h-106 l-8,-12 z" fill="#d99a1e"/>
    <circle cx="916" cy="558" r="2.6" fill="#ffffff"/>
    <text x="924" y="563" class="tagtx" fill="#3d2a03">Pending review</text>
    <path d="M1032,558 H1052" stroke="#5a6878" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M1068,546 h138 a3,3 0 0 1 3,3 v18 a3,3 0 0 1 -3,3 h-138 l-8,-12 z" fill="#2f7a4d"/>
    <circle cx="1070" cy="558" r="2.6" fill="#ffffff"/>
    <text x="1078" y="563" class="tagtx" fill="#ffffff">Engineer approves</text>
  </g>

  <!-- Outcome -->
  <g class="t">
    <line x1="48" y1="616" x2="1232" y2="616" stroke="#c9d1d9"/>
    <text x="48" y="643" style="font-size:15px;fill:#182433"><tspan font-weight="700">Outcome: </tspan>problems caught earlier, proven fixes reused, less paperwork, and every answer cited and every decision approved by a person.</text>
  </g>
</svg>
